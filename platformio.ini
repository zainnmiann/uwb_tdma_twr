; uwb_tdma_twr -- ESP32 UWB Pro with Display target.
;
; Builds core/ + port/esp32/. Never touches port/nrf52/ or sim/ -- those are
; built by the top-level Makefile and sim/Makefile respectively.
;
; IMPORTANT: every file under core/ MUST stay a .c file, compiled by gcc (not
; g++) in both this build and the Makefile build. That is what keeps a
; single core immune to C/C++ linkage and implicit-conversion differences --
; never rename a core/*.c to .cpp.

[platformio]
src_dir     = .
lib_dir     = port/esp32/lib

[env:esp32_uwb_pro_display]
platform   = espressif32
board      = esp-wrover-kit
framework  = arduino
monitor_speed = 921600
board_build.flash_mode = qio
board_build.f_cpu = 240000000L

build_src_filter =
  -<*>
  +<core/*.c>
  +<port/esp32/*.c>
  +<port/esp32/*.cpp>

build_flags =
  -I core
  -I port
  -I port/esp32
  -DCORE_DEBUG_LEVEL=0

extra_scripts = pre:port/esp32/pio_flags.py

lib_deps =
  adafruit/Adafruit SSD1306@^2.5.9
  adafruit/Adafruit GFX Library@^1.11.9
